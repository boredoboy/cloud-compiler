name: Build APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Unzip + Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and unzip blackhole-android.zip
        run: |
          echo "Looking for zip..."
          ZIP_FILE=$(find . -name "blackhole-android.zip" -type f | head -1)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: blackhole-android.zip not found!"
            ls -la
            exit 1
          fi
          
          echo "Found: $ZIP_FILE"
          unzip -o "$ZIP_FILE"
          echo "=== After unzip ==="
          ls -la
          ls -la blackhole-android/ || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: blackhole-android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blackhole-apk
          path: blackhole-android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Show result
        run: |
          echo "=== APK files ==="
          find blackhole-android/app/build/outputs -name "*.apk" -ls || echo "No APK found"
