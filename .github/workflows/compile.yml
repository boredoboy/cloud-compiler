name: Cloud Compiler & Any.Run Sandbox

on:
  repository_dispatch:
    types: [compile]

jobs:
  build_and_test:
    runs-on: ${{ github.event.client_payload.os }}
    timeout-minutes: 15

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup .NET (C#)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Java (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Universal Build & Dynamic Sandbox Engine
        shell: bash
        run: |
          python -m pip install psutil
          python -c "
          import os, sys, json, subprocess, urllib.request, zipfile, shutil, time, psutil

          # Чтение входных параметров
          with open(os.environ['GITHUB_EVENT_PATH'], 'r', encoding='utf-8') as f:
              event = json.load(f)
          payload = event['client_payload']
          chat_id = payload['chat_id']
          bot_token = payload['bot_token']
          filename = payload['filename']
          file_url = payload['file_url']
          target_os = payload['os']
          mode = payload.get('mode', 'build')

          def send_tg_msg(text):
              url = f'https://api.telegram.org/bot{bot_token}/sendMessage'
              data = json.dumps({'chat_id': chat_id, 'text': text, 'parse_mode': 'HTML'}).encode()
              req = urllib.request.Request(url, data=data, headers={'Content-Type': 'application/json'})
              try: urllib.request.urlopen(req)
              except Exception as e: print('TG Msg Error:', e)

          def send_tg_file(filepath, caption=''):
              boundary = '----WebKitFormBoundary7MA4YWxkTrZu0gW'
              url = f'https://api.telegram.org/bot{bot_token}/sendDocument'
              with open(filepath, 'rb') as f:
                  file_data = f.read()
              fname = os.path.basename(filepath)
              body = []
              body.append(f'--{boundary}\r\nContent-Disposition: form-data; name=\"chat_id\"\r\n\r\n{chat_id}\r\n'.encode())
              if caption:
                  body.append(f'--{boundary}\r\nContent-Disposition: form-data; name=\"caption\"\r\n\r\n{caption}\r\n'.encode())
                  body.append(f'--{boundary}\r\nContent-Disposition: form-data; name=\"parse_mode\"\r\n\r\nHTML\r\n'.encode())
              body.append(f'--{boundary}\r\nContent-Disposition: form-data; name=\"document\"; filename=\"{fname}\"\r\nContent-Type: application/octet-stream\r\n\r\n'.encode())
              body.append(file_data)
              body.append(f'\r\n--{boundary}--\r\n'.encode())
              req = urllib.request.Request(url, data=b''.join(body))
              req.add_header('Content-Type', f'multipart/form-data; boundary={boundary}')
              try: urllib.request.urlopen(req)
              except Exception as e: print('TG File Error:', e)

          try:
              # Скачиваем файл по прямой ссылке с серверов Telegram
              urllib.request.urlretrieve(file_url, filename)

              out_dir = os.path.abspath('dist')
              os.makedirs(out_dir, exist_ok=True)
              base_name, ext = os.path.splitext(filename)
              ext = ext.lower()
              is_win = 'windows' in target_os.lower()
              is_mac = 'macos' in target_os.lower()
              main_executable = None

              # ==========================================
              # 1. СБОРКА / ОБРАБОТКА ФАЙЛА
              # ==========================================
              if ext in ['.exe', '.bin', '.app']:
                  main_executable = os.path.abspath(filename)

              elif ext == '.py':
                  subprocess.run([sys.executable, '-m', 'pip', 'install', 'pyinstaller'], check=True)
                  subprocess.run(['pyinstaller', '--onefile', '--distpath', out_dir, filename], check=True)
                  main_executable = os.path.join(out_dir, f'{base_name}.exe' if is_win else base_name)

              elif ext in ['.cpp', '.cc', '.cxx']:
                  out_name = os.path.join(out_dir, f'{base_name}.exe' if is_win else base_name)
                  cmd = ['g++', '-O3', filename, '-o', out_name]
                  if is_win: cmd.insert(2, '-static')
                  subprocess.run(cmd, check=True)
                  main_executable = out_name

              elif ext == '.c':
                  out_name = os.path.join(out_dir, f'{base_name}.exe' if is_win else base_name)
                  cmd = ['gcc', '-O3', filename, '-o', out_name]
                  if is_win: cmd.insert(2, '-static')
                  subprocess.run(cmd, check=True)
                  main_executable = out_name

              elif ext == '.rs':
                  out_name = os.path.join(out_dir, f'{base_name}.exe' if is_win else base_name)
                  subprocess.run(['rustc', '-O', filename, '-o', out_name], check=True)
                  main_executable = out_name

              elif ext == '.go':
                  out_name = os.path.join(out_dir, f'{base_name}.exe' if is_win else base_name)
                  subprocess.run(['go', 'build', '-o', out_name, filename], check=True)
                  main_executable = out_name

              elif ext == '.cs':
                  proj_dir = os.path.abspath('csharp_proj')
                  os.makedirs(proj_dir, exist_ok=True)
                  subprocess.run(['dotnet', 'new', 'console', '-o', proj_dir, '--force'], check=True)
                  shutil.copy(filename, os.path.join(proj_dir, 'Program.cs'))
                  rid = 'win-x64' if is_win else ('osx-arm64' if is_mac else 'linux-x64')
                  subprocess.run(['dotnet', 'publish', proj_dir, '-c', 'Release', '-r', rid, '--self-contained', 'true', '-p:PublishSingleFile=true', '-o', out_dir], check=True)
                  main_executable = os.path.join(out_dir, 'csharp_proj.exe' if is_win else 'csharp_proj')

              elif ext == '.java':
                  subprocess.run(['javac', filename], check=True)
                  class_file = f'{base_name}.class'
                  jar_file = os.path.join(out_dir, f'{base_name}.jar')
                  subprocess.run(['jar', 'cfe', jar_file, base_name, class_file], check=True)
                  main_executable = jar_file

              elif ext == '.swift':
                  out_name = os.path.join(out_dir, base_name)
                  subprocess.run(['swiftc', filename, '-o', out_name], check=True)
                  main_executable = out_name

              elif ext == '.zip':
                  zip_dir = os.path.abspath('extracted_project')
                  with zipfile.ZipFile(filename, 'r') as z:
                      z.extractall(zip_dir)
                  if os.path.exists(os.path.join(zip_dir, 'main.py')):
                      subprocess.run([sys.executable, '-m', 'pip', 'install', 'pyinstaller'], check=True)
                      subprocess.run(['pyinstaller', '--onefile', '--distpath', out_dir, os.path.join(zip_dir, 'main.py')], check=True)
                      main_executable = os.path.join(out_dir, 'main.exe' if is_win else 'main')
                  else:
                      for root, _, files in os.walk(zip_dir):
                          for f in files:
                              fn, fe = os.path.splitext(f)
                              fp = os.path.join(root, f)
                              if fe == '.py': subprocess.run(['pyinstaller', '--onefile', '--distpath', out_dir, fp])
                              elif fe in ['.cpp', '.c']:
                                  o = os.path.join(out_dir, f'{fn}.exe' if is_win else fn)
                                  cmd = ['g++', '-O3', fp, '-o', o]
                                  if is_win: cmd.insert(2, '-static')
                                  subprocess.run(cmd)

              # ==========================================
              # 2. ПЕСОЧНИЦА (ANY.RUN АНАЛИЗ)
              # ==========================================
              if mode == 'test' and main_executable and os.path.exists(main_executable):
                  send_tg_msg('🧪 <b>Запуск в песочнице Any.Run...</b> Сбор метрик CPU/RAM, сети и логов.')
                  
                  exec_cmd = [main_executable]
                  if main_executable.endswith('.jar'):
                      exec_cmd = ['java', '-jar', main_executable]
                  if not is_win:
                      os.chmod(main_executable, 0o755)

                  before_files = set(os.listdir('.'))
                  start_time = time.time()
                  peak_cpu = 0.0
                  peak_ram_mb = 0.0
                  net_connections = set()

                  proc = subprocess.Popen(exec_cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
                  p = psutil.Process(proc.pid)

                  for _ in range(50):
                      if proc.poll() is not None:
                          break
                      try:
                          cpu = p.cpu_percent(interval=0.1)
                          ram = p.memory_info().rss / (1024 * 1024)
                          if cpu > peak_cpu: peak_cpu = cpu
                          if ram > peak_ram_mb: peak_ram_mb = ram
                          for conn in p.connections(kind='inet'):
                              net_connections.add(f'{conn.raddr.ip}:{conn.raddr.port}' if conn.raddr else f'Port {conn.laddr.port} (LISTEN)')
                      except Exception:
                          pass

                  if proc.poll() is None:
                      proc.terminate()
                      try: proc.wait(timeout=2)
                      except Exception: proc.kill()

                  exec_duration = time.time() - start_time
                  stdout, stderr = proc.communicate()
                  exit_code = proc.returncode

                  after_files = set(os.listdir('.')) - before_files
                  created_files = [f for f in after_files if f not in ['dist', filename, 'build', 'extracted_project']]

                  report_text = f'''==================================================
           DIHANT CLOUD SANDBOX REPORT
==================================================
Target Artifact : {os.path.basename(main_executable)}
Environment     : {target_os}
Execution Time  : {exec_duration:.2f} sec
Exit Code       : {exit_code}

[RESOURCE UTILIZATION]
Peak CPU Usage  : {peak_cpu:.1f}%
Peak RAM Usage  : {peak_ram_mb:.2f} MB

[NETWORK ACTIVITY]
Connections     : {len(net_connections)} detected
{chr(10).join(['  -> ' + c for c in net_connections]) if net_connections else '  -> No outbound sockets opened'}

[FILESYSTEM ACTIVITY]
Created Files   : {len(created_files)}
{chr(10).join(['  -> ' + f for f in created_files]) if created_files else '  -> No persistent files created'}

[STANDARD CONSOLE OUTPUT (STDOUT)]
{stdout.strip() if stdout.strip() else '[No output]'}

[STANDARD ERROR LOG (STDERR)]
{stderr.strip() if stderr.strip() else '[No errors]'}
=================================================='''

                  with open('sandbox_report.txt', 'w', encoding='utf-8') as rf:
                      rf.write(report_text)

                  summary = (
                      f'🔬 <b>ANY.RUN SANDBOX REPORT</b>\n'
                      f'━━━━━━━━━━━━━━━━━━━━\n'
                      f'📦 <b>Объект:</b> <code>{os.path.basename(main_executable)}</code>\n'
                      f'⏱️ <b>Время:</b> <code>{exec_duration:.2f}s</code> | <b>Статус:</b> <code>Exit {exit_code}</code>\n\n'
                      f'📊 <b>Ресурсы:</b>\n'
                      f'• 🧠 <b>CPU Peak:</b> <code>{peak_cpu:.1f}%</code>\n'
                      f'• 💾 <b>RAM Peak:</b> <code>{peak_ram_mb:.2f} MB</code>\n\n'
                      f'🌐 <b>Сеть:</b> <code>{len(net_connections)} сокетов</code>\n'
                      f'📁 <b>Файлы:</b> <code>{len(created_files)} создано</code>\n\n'
                      f'📄 <i>Полный лог прикреплен файлом.</i>'
                  )
                  send_tg_file('sandbox_report.txt', summary)

              # ==========================================
              # 3. ОТПРАВКА СКОМПИЛИРОВАННЫХ ФАЙЛОВ
              # ==========================================
              artifacts = [os.path.join(out_dir, f) for f in os.listdir(out_dir) if not f.startswith('.')]
              if artifacts:
                  if len(artifacts) == 1:
                      send_tg_file(artifacts[0], f'🚀 <b>Готовый билд:</b> <code>{os.path.basename(artifacts[0])}</code>\n💻 <b>Цель:</b> <code>{target_os}</code>')
                  else:
                      b_zip = 'compiled_bundle.zip'
                      with zipfile.ZipFile(b_zip, 'w') as zf:
                          for a in artifacts: zf.write(a, os.path.basename(a))
                      send_tg_file(b_zip, f'🚀 <b>Сборка завершена (архив)!</b>\n💻 <b>Цель:</b> <code>{target_os}</code>')

          except Exception as e:
              send_tg_msg(f'❌ <b>Ошибка выполнения:</b>\n<code>{str(e)}</code>')
              raise e
          "
