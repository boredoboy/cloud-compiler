name: Telegram Chat Exporter

on:
  repository_dispatch:
    types: [export_chat]

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install --no-cache-dir pyrogram tgcrypto requests

      - name: Execute Chat Export
        env:
          PYTHONUNBUFFERED: "1"
          API_ID: ${{ secrets.TG_API_ID }}
          API_HASH: ${{ secrets.TG_API_HASH }}
          SESSION: ${{ secrets.TG_SESSION }}
          TARGET: ${{ github.event.client_payload.target }}
          FORMAT: ${{ github.event.client_payload.format }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          BOT_TOKEN: ${{ github.event.client_payload.bot_token }}
        run: |
          cat << 'EOF' > run.py
          import os
          import sys
          import asyncio
          import json
          import requests
          from pyrogram import Client
          from pyrogram.errors import FloodWait

          API_ID = int(os.environ['API_ID'])
          API_HASH = os.environ['API_HASH']
          SESSION = os.environ['SESSION'].strip()
          TARGET = os.environ['TARGET'].strip()
          FORMAT = os.environ.get('FORMAT', 'txt').lower().strip()
          CHAT_ID = os.environ['CHAT_ID']
          BOT_TOKEN = os.environ['BOT_TOKEN']

          def notify_bot(text):
              try:
                  requests.post(
                      f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage",
                      json={"chat_id": CHAT_ID, "text": text, "parse_mode": "HTML"},
                      timeout=10
                  )
              except Exception as err:
                  print(f"Ошибка отправки уведомления боту: {err}", flush=True)

          async def run_export():
              print("🚀 Запуск Pyrogram клиента...", flush=True)
              app = Client(
                  "memory_export",
                  session_string=SESSION,
                  api_id=API_ID,
                  api_hash=API_HASH,
                  in_memory=True,
                  no_updates=True
              )

              try:
                  await asyncio.wait_for(app.start(), timeout=30)
              except asyncio.TimeoutError:
                  err = "Таймаут подключения к Telegram (сессия зависла или заблокирована)."
                  print(f"❌ {err}", flush=True)
                  notify_bot(f"❌ <b>Ошибка:</b> {err}")
                  return
              except Exception as e:
                  err = f"Ошибка авторизации: {e}"
                  print(f"❌ {err}", flush=True)
                  notify_bot(f"❌ <b>Ошибка авторизации:</b>\n<code>{e}</code>")
                  return

              try:
                  print(f"🔍 Поиск чата: {TARGET}...", flush=True)
                  chat = await app.get_chat(TARGET)
                  title = chat.title or chat.first_name or TARGET
                  print(f"✅ Чат найден: {title} (ID: {chat.id})", flush=True)

                  messages = []
                  count = 0
                  print("📥 Сбор сообщений...", flush=True)

                  async for msg in app.get_chat_history(chat.id):
                      text = msg.text or msg.caption or ""
                      if not text:
                          if msg.photo: text = "[Фото]"
                          elif msg.video: text = "[Видео]"
                          elif msg.voice: text = "[Голосовое сообщение]"
                          elif msg.document: text = "[Документ]"
                          elif msg.sticker: text = "[Стикер]"
                          else: continue

                      date_str = msg.date.strftime("%Y-%m-%d %H:%M:%S")
                      sender = "Я" if msg.from_user and msg.from_user.is_self else (msg.from_user.first_name if msg.from_user else "Собеседник")

                      if FORMAT == "json":
                          messages.append({"date": date_str, "sender": sender, "text": text})
                      else:
                          messages.append(f"[{date_str}] {sender}: {text}\n")

                      count += 1
                      if count % 500 == 0:
                          print(f"   Собрано {count} сообщений...", flush=True)

                  print(f"📊 Всего собрано сообщений: {len(messages)}", flush=True)

                  if not messages:
                      notify_bot(f"⚠️ В чате <b>{title}</b> не найдено сообщений.")
                      return

                  messages.reverse()

                  safe_name = "".join(c for c in title if c.isalnum() or c in (" ", "_", "-")).strip() or "chat"
                  filename = f"Export_{safe_name}.{FORMAT}"

                  print(f"💾 Запись в файл {filename}...", flush=True)
                  if FORMAT == "json":
                      with open(filename, "w", encoding="utf-8") as f:
                          json.dump(messages, f, ensure_ascii=False, indent=2)
                  else:
                      with open(filename, "w", encoding="utf-8") as f:
                          f.writelines(messages)

                  print("📤 Отправка файла в 'Избранное'...", flush=True)
                  await app.send_document(
                      "me",
                      document=filename,
                      caption=f"📁 <b>Экспорт чата:</b> <code>{title}</code>\n⚙️ <b>Формат:</b> <code>{FORMAT.upper()}</code>\n💬 <b>Сообщений:</b> <code>{len(messages)}</code>"
                  )

                  notify_bot(f"✅ <b>Экспорт чата «{title}» готов!</b>\nФайл отправлен в твоё <b>Избранное (Saved Messages)</b>.")
                  os.remove(filename)
                  print("🎉 Задача полностью выполнена!", flush=True)

              except FloodWait as fw:
                  err = f"Telegram ограничил частоту запросов на {fw.value} секунд."
                  print(f"⚠️ {err}", flush=True)
                  notify_bot(f"⚠️ {err}")
              except Exception as e:
                  print(f"❌ Ошибка во время выполнения: {e}", flush=True)
                  notify_bot(f"❌ <b>Ошибка при экспорте:</b>\n<code>{str(e)}</code>")
              finally:
                  await app.stop()

          asyncio.run(run_export())
          EOF

          python run.py
