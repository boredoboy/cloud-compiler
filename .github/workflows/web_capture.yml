name: Web Capture Engine

on:
  repository_dispatch:
    types: [web_capture] # Этот Action реагирует только на эту команду

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright & Dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run Web Capture & Send to Telegram
        shell: bash
        run: |
          python -c "
          import os, json, time, requests
          from playwright.sync_api import sync_playwright

          # Читаем данные от бота
          with open(os.environ['GITHUB_EVENT_PATH'], 'r', encoding='utf-8') as f:
              event = json.load(f)
          
          payload = event['client_payload']
          url = payload['url']
          mode = payload['mode'] # 'screenshot' или 'video'
          chat_id = payload['chat_id']
          bot_token = payload['bot_token']

          def send_tg_message(text):
              requests.post(f'https://api.telegram.org/bot{bot_token}/sendMessage', 
                            data={'chat_id': chat_id, 'text': text, 'parse_mode': 'HTML'})

          def send_tg_document(filepath, caption):
              with open(filepath, 'rb') as doc:
                  requests.post(f'https://api.telegram.org/bot{bot_token}/sendDocument',
                                data={'chat_id': chat_id, 'caption': caption, 'parse_mode': 'HTML'},
                                files={'document': doc})

          try:
              if not url.startswith('http'):
                  url = 'https://' + url

              with sync_playwright() as p:
                  # Настраиваем виртуальный браузер (Full HD экран)
                  browser = p.chromium.launch(headless=True)
                  
                  if mode == 'video':
                      # Включаем запись видео
                      context = browser.new_context(
                          viewport={'width': 1920, 'height': 1080},
                          record_video_dir='videos/',
                          record_video_size={'width': 1920, 'height': 1080}
                      )
                      page = context.new_page()
                      page.goto(url, wait_until='networkidle', timeout=60000)
                      
                      # Скрипт для плавного скроллинга страницы вниз
                      page.evaluate('''
                          async () => {
                              await new Promise((resolve) => {
                                  let totalHeight = 0;
                                  let distance = 150;
                                  let timer = setInterval(() => {
                                      let scrollHeight = document.body.scrollHeight;
                                      window.scrollBy(0, distance);
                                      totalHeight += distance;
                                      if (totalHeight >= scrollHeight - window.innerHeight || totalHeight > 15000) {
                                          clearInterval(timer);
                                          resolve();
                                      }
                                  }, 100);
                              });
                          }
                      ''')
                      time.sleep(1) # Ждем секунду после скролла
                      
                      # Закрываем контекст, чтобы видео сохранилось
                      context.close()
                      browser.close()
                      
                      # Находим записанное видео
                      video_file = os.path.join('videos', os.listdir('videos')[0])
                      
                      # Отправляем в ТГ
                      send_tg_document(video_file, f'🎥 <b>Скролл сайта:</b> {url}')

                  elif mode == 'screenshot':
                      context = browser.new_context(viewport={'width': 1920, 'height': 1080})
                      page = context.new_page()
                      page.goto(url, wait_until='networkidle', timeout=60000)
                      
                      # Делаем скриншот ВСЕЙ страницы (от верха до низа)
                      pic_path = 'screenshot.png'
                      page.screenshot(path=pic_path, full_page=True)
                      
                      browser.close()
                      
                      # Отправляем в ТГ
                      send_tg_document(pic_path, f'📸 <b>Скриншот сайта:</b> {url}')

          except Exception as e:
              send_tg_message(f'❌ <b>Ошибка обработки сайта:</b>\n<code>{str(e)}</code>')
          "
