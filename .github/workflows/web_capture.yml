name: Web Capture Engine

on:
  repository_dispatch:
    types: [web_capture]

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Playwright & Dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run Web Capture & Send to Telegram
        shell: bash
        run: |
          python -c "
          import os, json, time, requests, subprocess
          from playwright.sync_api import sync_playwright

          with open(os.environ['GITHUB_EVENT_PATH'], 'r', encoding='utf-8') as f:
              event = json.load(f)
          
          payload = event['client_payload']
          url = payload['url']
          mode = payload['mode']
          chat_id = payload['chat_id']
          bot_token = payload['bot_token']

          def send_tg_message(text):
              requests.post(f'https://api.telegram.org/bot{bot_token}/sendMessage', 
                            data={'chat_id': chat_id, 'text': text, 'parse_mode': 'HTML'})

          def send_tg_document(filepath, caption):
              with open(filepath, 'rb') as doc:
                  requests.post(f'https://api.telegram.org/bot{bot_token}/sendDocument',
                                data={'chat_id': chat_id, 'caption': caption, 'parse_mode': 'HTML'},
                                files={'document': doc})
                                
          def send_tg_video(filepath, caption):
              with open(filepath, 'rb') as vid:
                  requests.post(f'https://api.telegram.org/bot{bot_token}/sendVideo',
                                data={'chat_id': chat_id, 'caption': caption, 'parse_mode': 'HTML'},
                                files={'video': vid})

          try:
              if not url.startswith('http'):
                  url = 'https://' + url

              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  
                  if mode == 'video':
                      context = browser.new_context(
                          viewport={'width': 1920, 'height': 1080},
                          record_video_dir='videos/',
                          record_video_size={'width': 1920, 'height': 1080}
                      )
                      page = context.new_page()
                      
                      # Ждем полной загрузки сети (таймаут увеличен до 90 сек)
                      page.goto(url, wait_until='networkidle', timeout=90000)
                      
                      # ДАЕМ САЙТУ 5 СЕКУНД, чтобы прогрузить картинки и анимации
                      time.sleep(5)
                      
                      # Кинематографичный плавный скроллинг (60 FPS)
                      page.evaluate('''
                          async () => {
                              await new Promise((resolve) => {
                                  let totalHeight = 0;
                                  let distance = 25; // Маленький шаг для плавности
                                  let timer = setInterval(() => {
                                      let scrollHeight = document.body.scrollHeight;
                                      window.scrollBy(0, distance);
                                      totalHeight += distance;
                                      
                                      // Останавливаем, если дошли до конца ИЛИ прошли 40000 px (защита от бесконечных сайтов)
                                      if (totalHeight >= scrollHeight - window.innerHeight || totalHeight > 40000) {
                                          clearInterval(timer);
                                          resolve();
                                      }
                                  }, 16); // 16 миллисекунд = 60 обновлений в секунду
                              });
                          }
                      ''')
                      
                      # Ждем пару секунд внизу сайта, чтобы было видно футер
                      time.sleep(2)
                      
                      context.close()
                      browser.close()
                      
                      webm_file = os.path.join('videos', os.listdir('videos')[0])
                      mp4_file = 'output_video.mp4'
                      
                      # Рендерим в честные 60 FPS (-r 60)
                      subprocess.run([
                          'ffmpeg', '-i', webm_file, 
                          '-c:v', 'libx264', '-preset', 'fast', '-crf', '23', 
                          '-r', '60', 
                          '-pix_fmt', 'yuv420p', mp4_file
                      ], check=True)
                      
                      send_tg_video(mp4_file, f'🎥 <b>Скролл сайта:</b> {url}')

                  elif mode == 'screenshot':
                      context = browser.new_context(viewport={'width': 1920, 'height': 1080})
                      page = context.new_page()
                      page.goto(url, wait_until='networkidle', timeout=90000)
                      time.sleep(5) # Тоже ждем 5 секунд для загрузки всех шрифтов и картинок
                      
                      pic_path = 'screenshot.png'
                      page.screenshot(path=pic_path, full_page=True)
                      
                      browser.close()
                      
                      send_tg_document(pic_path, f'📸 <b>Скриншот сайта:</b> {url}')

          except Exception as e:
              send_tg_message(f'❌ <b>Ошибка обработки сайта:</b>\n<code>{str(e)}</code>')
          "
